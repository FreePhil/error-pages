<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>網站維護中</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font: 18px/1.6 system-ui, sans-serif; color: #243246; background: #f7f9fc; }
    main { max-width: 560px; text-align: center; }
    .label { color: #315bd2; font-size: 13px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1 { font-size: clamp(32px, 7vw, 48px); line-height: 1.15; letter-spacing: -.04em; }
    p { color: #536278; }
    .line { width: 48px; height: 4px; margin: 32px auto; background: #315bd2; border-radius: 4px; }
    small { font-size: 14px; color: #536278; }
  </style>
</head>
<body>
  <main>
    <span class="label">例行維護公告</span>
    <h1>網站維護中</h1>
    <p>我們正在進行網站更新，暫時無法提供服務。</p>
    <div class="line" aria-hidden="true"></div>
    <small>感謝您的耐心等候，請稍後再試。</small>
  </main>
</body>
</html>
