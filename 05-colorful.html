<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>網站維護中</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font: 18px/1.7 system-ui, sans-serif; color: #30264c; background: linear-gradient(135deg, #e9e1ff, #e0f4f0); }
    main { width: 100%; max-width: 580px; padding: clamp(28px, 7vw, 56px); text-align: center; background: #ffffffeb; border: 1px solid white; border-radius: 28px; }
    .badge { display: inline-block; padding: 6px 14px; border-radius: 50px; background: #eee8fb; color: #63409c; font-size: 13px; font-weight: 600; }
    h1 { font-size: clamp(34px, 7vw, 48px); line-height: 1.15; letter-spacing: -.04em; }
    p { color: #655c76; }
    .decoration { display: flex; justify-content: center; gap: 8px; margin-top: 32px; }
    .decoration span { width: 28px; height: 8px; border-radius: 8px; background: #8c6ac5; }
    .decoration span:nth-child(2) { background: #bb9bdc; }
    .decoration span:nth-child(3) { background: #63a99e; }
  </style>
</head>
<body>
  <main>
    <span class="badge">網站更新中</span>
    <h1>網站維護中<br>美好體驗即將回歸</h1>
    <p>我們正在用心改善網站，期待以更好的面貌與您見面。請稍後再來看看！</p>
    <div class="decoration" aria-hidden="true"><span></span><span></span><span></span></div>
  </main>
</body>
</html>
