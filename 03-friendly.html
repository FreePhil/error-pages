<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>網站維護中</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font: 18px/1.7 system-ui, sans-serif; background: #fff8ea; color: #493827; }
    main { max-width: 540px; text-align: center; }
    .icon { display: grid; place-items: center; width: 96px; height: 96px; margin: auto; border-radius: 28px; background: #ffe3aa; font-size: 44px; }
    h1 { font-size: clamp(32px, 7vw, 46px); line-height: 1.2; letter-spacing: -.04em; }
    p { color: #705a41; }
    .note { display: inline-block; margin-top: 20px; padding: 10px 20px; border: 1px solid #d8bc90; border-radius: 50px; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">☕</div>
    <h1>網站維護中<br>讓我們稍作休息</h1>
    <p>網站正在進行保養與更新，準備就緒後就會再次與您見面。</p>
    <span class="note">謝謝您的耐心等候！</span>
  </main>
</body>
</html>
