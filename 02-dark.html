<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>網站維護中</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font: 17px/1.7 system-ui, sans-serif; background: #111820; color: #f0f5f8; }
    main { max-width: 580px; padding: clamp(24px, 6vw, 52px); border: 1px solid #33424d; border-radius: 16px; background: #18232d; }
    .status { display: inline-flex; align-items: center; gap: 10px; font: 13px/1.5 monospace; color: #88e4c1; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #88e4c1; }
    h1 { font-size: clamp(30px, 6vw, 42px); line-height: 1.2; letter-spacing: -.03em; }
    p { color: #b8c6d0; }
    footer { margin-top: 32px; padding-top: 20px; border-top: 1px solid #33424d; color: #b8c6d0; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <span class="status"><span class="dot" aria-hidden="true"></span> 系統維護進行中</span>
    <h1>網站維護中<br>為您帶來更好的體驗</h1>
    <p>我們正在更新系統，維護完成後將恢復網站服務。</p>
    <footer>請稍後再試，感謝您的耐心與體諒。</footer>
  </main>
</body>
</html>
