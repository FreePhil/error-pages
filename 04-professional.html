<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>網站維護中</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font: 17px/1.7 Arial, sans-serif; color: #23344c; background: #eef2f6; }
    main { width: 100%; max-width: 640px; padding: clamp(24px, 6vw, 48px); background: white; border-top: 6px solid #21599b; box-shadow: 0 12px 40px #23344c0d; }
    .label { color: #21599b; font-size: 13px; font-weight: bold; text-transform: uppercase; letter-spacing: .1em; }
    h1 { font-size: clamp(28px, 6vw, 38px); line-height: 1.2; }
    p { color: #526176; }
    aside { margin-top: 28px; padding: 16px 20px; border-left: 3px solid #9cb8d8; background: #f3f6fa; font-size: 15px; }
  </style>
</head>
<body>
  <main>
    <span class="label">服務公告</span>
    <h1>網站維護中</h1>
    <p>為提升網站服務的穩定性，我們正在進行例行維護。</p>
    <p>請稍後再試，感謝您的理解與配合。</p>
    <aside>維護完成後將恢復正常服務。</aside>
  </main>
</body>
</html>
